# İş merkezleri ve saat ücretleri. value: null = firma verisi bekleniyor (TODO).
# labor_rate: operatör başına işçilik saat ücreti (genel gider hariç).
# machine_rate: makine/tesis saat ücreti (amortisman, enerji, bakım); makine yoksa 0 girin.
# efficiency: standart sürenin fiili süreye oranı (0-1). Ödenen süre = standart süre / verim.
# Para birimi her kayıtta ayrı tutulur (EUR, TRY...); karma kullanılabilir.
# Ücret sınıfları (Kemal, 2026-11-04): saat ücreti her iş merkezi için ayrı girilmez;
# mühendis saat ücretine çarpanla bağlanır. wage_class'ı olan iş merkezinin labor_rate'i
# yüklemede türetilir: engineer_rate × sınıf çarpanı. wage_class'sız merkezler labor_rate'i
# elle girer. Çarpanı veya mühendis ücretini değiştirmek bağlı tüm merkezleri birlikte günceller.
engineer_rate: {value: null, currency: EUR, per: h, desc: "Mühendis saat ücreti (ücret sınıflarının tabanı)"}
wage_classes:
  - id: islak_serim
    name: "Islak serim (en düşük ücret)"
    multiplier: {value: 0.2, unit: ratio, source: user, desc: "Mühendis ücretine oranı (varsayılan %20, Kemal)"}
  - id: prepreg_serim
    name: "Prepreg serim"
    multiplier: {value: 0.5, unit: ratio, source: user, desc: "Mühendis ücretine oranı (yarım)"}
  - id: trim
    name: "Trim"
    multiplier: {value: 0.5, unit: ratio, source: user, desc: "Mühendis ücretine oranı (yarım)"}
