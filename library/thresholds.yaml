# Karar eşikleri ve genel katsayılar. source: user = proje talimatındaki varsayılan eşik.
draft:
  min_ok_deg: {value: 2.0, unit: deg, source: user, desc: "Bu açı ve üstü: tek parça kalıp"}
  warn_min_deg: {value: 0.0, unit: deg, source: user, desc: "0 ile min_ok arası: uyarı; altı: ters açı"}
  warn_review_ratio: {value: 0.25, unit: ratio, source: default, desc: "0-2° (uyarı) bölgesi kalıp yüzeyinin bu payını aşarsa çekme yönü manual_review"}
undercut:
  core_max_area_ratio: {value: 0.10, unit: ratio, source: user, desc: "Ters açı bölgesi alanı / kalıp alanı bu orandan küçükse maça"}
  # Aşağıdakiler algoritma varsayılanları (firma değeri değil); Kemal değiştirebilir.
  noise_area_ratio: {value: 0.002, unit: ratio, source: default, desc: "Bu orandan küçük VE noise_draft_deg'den sığ ters açı lekesi tessellation gürültüsü sayılır (kararda yok sayılır, manual_review notu düşer)"}
  noise_draft_deg: {value: 5.0, unit: deg, source: default, desc: "Gürültü sayılabilecek en derin ters açı (0 ile -bu değer arası)"}
  opposite_cos: {value: -0.5, unit: ratio, source: default, desc: "İki ters açı bölgesinin yanal normalleri arasındaki kosinüs bunun altındaysa karşılıklı iki yan sayılır"}
  max_split_pieces: {value: 3, unit: count, source: user, desc: "Bölünmüş kalıpta önerilecek en fazla parça sayısı (1, 2, 3 parçalı seçenek)"}
  core_cost_weight: {value: 1.0, unit: ratio, source: default, desc: "Yöntem karşılaştırması: bir maçanın göreli maliyet puanı (TODO Kemal: kalibre et)"}
  core_area_cost_weight: {value: 100.0, unit: ratio, source: default, desc: "Yöntem karşılaştırması: maçaların kalıp yüzeyindeki toplam alan payı başına puan (100: yüzeyin %1'i maçalıysa +1 maça kadar; TODO Kemal: kalibre et)"}
  split_cost_weight: {value: 3.0, unit: ratio, source: default, desc: "Yöntem karşılaştırması: kalıbın her ek parçasının göreli maliyet puanı (TODO Kemal: kalibre et)"}
  unresolved_cost_weight: {value: 100.0, unit: ratio, source: default, desc: "Yöntem karşılaştırması: çözülemeyen her ters açı bölgesi için ceza puanı"}
  warn_cost_weight: {value: 2.0, unit: ratio, source: default, desc: "Yöntem karşılaştırması: yüzeyin tamamı warn_min–min_ok arası (düşük çekme) çıkarsa eklenen puan; kısmi pay oranlanır"}
  sandwich_tol_deg: {value: 10.0, unit: deg, source: default, desc: "İki ayırma düzlemi arasındaki parçanın düzleme paralel çıkışındaki izin verilen sapma"}
  threshold_margin_ratio: {value: 0.2, unit: ratio, source: default, desc: "Bölge alan oranı maça eşiğine bu bağıl pay kadar yakınsa karar manual_review"}
pull_search:
  max_tilt_deg: {value: 90.0, unit: deg, source: default, desc: "Aday çekme yönleri seçili yüzeyin ortalama iç normalinden en fazla bu kadar sapar"}
  samples: {value: 600, unit: count, source: default, desc: "Küre üzerinde taranan aday yön sayısı (tam küre için; koni dışı atılır)"}
  piece_max_tilt_deg: {value: 120.0, unit: deg, source: default, desc: "Bölünmüş kalıp parçalarının çekme yönü, parçanın ortalama iç normalinden en fazla bu kadar sapar"}
  refine_min_step_deg: {value: 0.1, unit: deg, source: default, desc: "Yerel optimizasyonun en küçük adımı"}
  robust_min_quantile: {value: 0.01, unit: ratio, source: default, desc: "En küçük çekme açısı üçgenlerin bu payı dışarıda bırakılarak okunur (tessellation gürültüsü)"}
trim:
  trim_all_openings: {value: 1, unit: ratio, source: user, desc: "1: parça üzerindeki tüm boşluk, delik ve kenarlar trimlenir (trim çevresi = kalıp yüzeyinin tüm sınırı); 0: yalnız dış kenar"}
tessellation:
  max_angular_deflection_deg: {value: 0.5, unit: deg, source: user, desc: "Tessellation açısal sapma üst sınırı"}
costing:
  nest_efficiency: {value: 0.80, unit: ratio, source: user, desc: "Kumaş nest verimi (kullanılan alan / harcanan alan); harcanan = 1 / verim. Kemal 2026-11-05: %80"}
  fire_ratio: {value: 0.0, unit: ratio, source: default, desc: "Nest dışı ek fire payı (kullanıcı teklifte girer)"}
  nesting_scrap_ratio: {value: null, unit: ratio, desc: "Varsayılan nesting firesi (fire alanı / net ply alanı)"}
  learning_curve_ratio: {value: null, unit: ratio, desc: "Öğrenme eğrisi oranı LC (örn. 0.85); T_n = T_ref × (n/ref)^log2(LC)"}
  # Proses şablonundaki standart sürelerin hangi parça sırasına ait olduğu (1 = ilk parça süresi, T_1).
  learning_reference_unit: {value: 1, unit: part, source: user, desc: "Standart sürelerin referans parça sırası"}
  overhead_ratio: {value: null, unit: ratio, desc: "Genel gider oranı (overhead_basis üzerine)"}
  # direct_cost: malzeme + sarf + işçilik + makine + autoclave üzerine; labor: yalnız işçilik üzerine.
  overhead_basis: direct_cost
  margin_ratio: {value: null, unit: ratio, desc: "Kâr oranı (margin_basis'e göre)"}
  # markup: fiyat = maliyet × (1 + oran); margin: fiyat = maliyet / (1 - oran).
  margin_basis: markup
  consumable_waste_ratio: {value: null, unit: ratio, desc: "Sarf malzeme kesim/bindirme payı"}
  autoclave_spacing: {value: null, unit: mm, desc: "Autoclave yerleşiminde kalıp çevresine bırakılan boşluk (her kenar)"}
  # Sipariş toplamı bu değerin altındaysa fark "price.min_order_topup" satırı olarak eklenir. 0 = minimum yok.
  # TODO(Kemal): firmanın gerçek minimum sipariş tutarı ve para birimi.
  min_order_value: {value: 0, currency: EUR, per: pcs, source: default, desc: "Minimum sipariş tutarı (sipariş başına; 0 = devre dışı)"}
  # Adet taramasında (teklif adet duyarlılığı) kullanılan varsayılan adetler.
  sweep_quantities: [1, 5, 10, 25, 50, 100]
acceptance:
  cost_tolerance: {value: 0.15, unit: ratio, source: user, desc: "Faz 1 kabul: fiili maliyete göre izin verilen sapma"}
complexity_factors:
  dusuk: {value: 1.0, unit: ratio, source: default, desc: "Düşük karmaşıklık süre çarpanı (referans)"}
  orta: {value: null, unit: ratio, desc: "Orta karmaşıklık süre çarpanı"}
  yuksek: {value: null, unit: ratio, desc: "Yüksek karmaşıklık süre çarpanı"}
