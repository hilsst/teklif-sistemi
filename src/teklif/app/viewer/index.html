<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f4f5f7;font-family:sans-serif}
#c{width:100%;height:100%;display:block}
#tip{position:absolute;pointer-events:none;background:#222;color:#fff;font-size:12px;padding:3px 7px;border-radius:4px;display:none}
#hint{position:absolute;left:8px;bottom:6px;font-size:11px;color:#666}
</style></head>
<body>
<canvas id="c"></canvas><div id="tip"></div>
<div id="hint" style="display:block">Sürükle: her yöne 360° döndür · tekerlek: yakınlaştır · sağ tuş sürükle: kaydır · sağ tık: elemanı gizle · tıkla: yüzü seç/bırak</div>
<script src="three.min.js"></script>
<script>
const PALETTE=[0xb0b0b0,0x4a78c2,0x2e9e4f,0xe6b800,0xd62728,0xf0b27a,0x9ecae1,0xc7e9c0,
  0x3b82f6,0xf97316,0xa855f7,0x14b8a6,0xca8a04,0xec4899,0x1f2937,0xcbd5e1,
  0xff2d95,0x22d3ee,0x84cc16,0xfacc15,0xe11d48,0x0ea5e9]; // 16-21 one colour per core // grey, blue, green, yellow, red, flange, fill, extension; 8-13 mold pieces, 14 core, 15 parting wall
let geomRev='',lineGroup=null,axesGroup=null,pullArrow=null,scene,camera,renderer,controls,mesh,geo,args=null,fitted=null,clickN=0,faceInfo={},pendingT=new Set(),inflight=[],syncTimer=null,faceTris={};
const canvas=document.getElementById('c'),tip=document.getElementById('tip');
function send(type,data){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},data),'*');}
// Free trackball: no pole limit like OrbitControls, so a part can be turned a full 360 deg in
// any direction. Left drag rotates about the screen axes, right/middle drag pans, wheel zooms.
function Trackball(camera,dom){
  this.target=new THREE.Vector3(); const self=this; let mode=null,last=[0,0];
  dom.addEventListener('contextmenu',e=>e.preventDefault());
  dom.addEventListener('pointerdown',e=>{
    mode=e.button===0?'rot':(e.button===1||e.button===2)?'pan':null; last=[e.clientX,e.clientY];
    try{dom.setPointerCapture(e.pointerId);}catch(_){}});
  const end=()=>{mode=null;}; dom.addEventListener('pointerup',end); dom.addEventListener('pointercancel',end);
  dom.addEventListener('pointermove',e=>{
    if(!mode)return; const dx=e.clientX-last[0],dy=e.clientY-last[1]; last=[e.clientX,e.clientY];
    const h=Math.max(dom.clientHeight,1);
    if(mode==='rot'){
      const k=2*Math.PI/h, off=camera.position.clone().sub(self.target);
      const right=new THREE.Vector3().crossVectors(off.clone().negate(),camera.up).normalize();
      const qx=new THREE.Quaternion().setFromAxisAngle(camera.up.clone().normalize(),-dx*k);
      const qy=new THREE.Quaternion().setFromAxisAngle(right,-dy*k);
      const q=qx.multiply(qy); off.applyQuaternion(q); camera.up.applyQuaternion(q).normalize();
      camera.position.copy(self.target).add(off);
    }else{
      const off=camera.position.clone().sub(self.target), dist=off.length();
      const sc=2*dist*Math.tan(camera.fov*Math.PI/360)/h;
      const right=new THREE.Vector3().crossVectors(off.clone().negate(),camera.up).normalize();
      const up=new THREE.Vector3().crossVectors(right,off.clone().negate()).normalize();
      const mv=right.multiplyScalar(-dx*sc).add(up.multiplyScalar(dy*sc));
      self.target.add(mv); camera.position.add(mv);
    }
  });
  dom.addEventListener('wheel',e=>{
    e.preventDefault(); const off=camera.position.clone().sub(self.target);
    off.multiplyScalar(Math.pow(0.9985,-e.deltaY)); camera.position.copy(self.target).add(off);
  },{passive:false});
  this.update=function(){camera.lookAt(self.target);};
}
function init(){
  renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  scene=new THREE.Scene(); scene.background=new THREE.Color(0xf4f5f7);
  camera=new THREE.PerspectiveCamera(40,1,1,1e6); camera.up.set(0,0,1);
  controls=new Trackball(camera,canvas);
  scene.add(new THREE.AmbientLight(0xffffff,0.55));
  const d1=new THREE.DirectionalLight(0xffffff,0.7); d1.position.set(1,1,2); camera.add(d1); scene.add(camera);
  const d2=new THREE.DirectionalLight(0xffffff,0.35); d2.position.set(-1,-1,-0.5); camera.add(d2);
  let down=null;
  canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
  canvas.addEventListener('pointerup',e=>{
    if(!down||(e.button!==0&&e.button!==2))return; const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null;
    if(moved>4||args.readonly)return; const f=pick(e); if(f===null||f<0)return;
    const toggle=()=>{const t=Array.from(pendingT); pendingT=new Set(); return t;};
    if(e.button===2){ // hide an element of the assembly; sends the toggles still waiting with it
      if(syncTimer){clearTimeout(syncTimer);syncTimer=null;}
      const tg=toggle(); clickN++; const t=Date.now(); if(tg.length)inflight.push({t:t,set:new Set(tg)});
      send('streamlit:setComponentValue',{value:{hide:f,toggles:tg,n:clickN,t:t},dataType:'json'}); return;}
    // left click: toggle the face on the screen at once; the toggles (not the whole selection, so
    // a change made meanwhile on the server is not undone) are reported once the clicking pauses,
    // so many clicks cost one server run instead of one each
    if(pendingT.has(f))pendingT.delete(f); else pendingT.add(f);
    paintFace(f, isSel(f)?1:0);
    if(syncTimer)clearTimeout(syncTimer);
    syncTimer=setTimeout(()=>{syncTimer=null; const tg=toggle(); if(!tg.length)return; clickN++; const t=Date.now();
      inflight.push({t:t,set:new Set(tg)});
      send('streamlit:setComponentValue',{value:{toggles:tg,n:clickN,t:t},dataType:'json'});},(args.sync_ms??2000));
  });
  canvas.addEventListener('pointermove',e=>{
    if(args.readonly)return; const f=pick(e); if(f===null){tip.style.display='none';return;}
    const i=faceInfo[f]; tip.textContent='Yüz '+f+(i?' · '+i.toFixed(3)+' m²':''); tip.style.display='block';
    tip.style.left=(e.offsetX+12)+'px'; tip.style.top=(e.offsetY+12)+'px';});
  canvas.addEventListener('pointerleave',()=>{tip.style.display='none';});
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
}
let serverSel=new Set();
function isSel(f){let v=serverSel.has(f); for(const x of inflight)if(x.set.has(f))v=!v; if(pendingT.has(f))v=!v; return v;}
function paintFace(f,idx){
  if(!geo)return; const col=geo.attributes.color.array, c=new THREE.Color(PALETTE[idx]);
  for(const t of (faceTris[f]||[])){for(let v=0;v<3;v++){const o=(t*3+v)*3;col[o]=c.r;col[o+1]=c.g;col[o+2]=c.b;}}
  geo.attributes.color.needsUpdate=true;
}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(e){
  if(!mesh)return null; const r=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera); const h=ray.intersectObject(mesh)[0];
  return h?args.tri_face[h.faceIndex]:null;
}
function resize(h){
  const w=document.body.clientWidth; renderer.setSize(w,h,false); canvas.style.height=h+'px';
  camera.aspect=w/h; camera.updateProjectionMatrix(); send('streamlit:setFrameHeight',{height:h});
}
function label(txt,color){
  const c=document.createElement('canvas');c.width=160;c.height=64;const g=c.getContext('2d');
  g.fillStyle=color;g.font='bold 44px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,80,34);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));return sp;
}
function arrow(dir,len,hex,txt,origin){
  const g=new THREE.Group();const d=new THREE.Vector3(...dir).normalize();
  g.add(new THREE.ArrowHelper(d,origin,len,hex,len*0.18,len*0.09));
  if(txt){const l=label(txt,'#'+hex.toString(16).padStart(6,'0'));l.scale.set(len*0.55,len*0.22,1);
    l.position.copy(origin).add(d.clone().multiplyScalar(len*1.15));g.add(l);}
  return g;
}
function overlays(a){
  for(const o of [axesGroup,pullArrow,lineGroup]){if(!o)continue;scene.remove(o);o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(n.material){if(n.material.map)n.material.map.dispose();n.material.dispose();}});}
  const s=geo.boundingSphere,bb=new THREE.Box3().setFromBufferAttribute(geo.attributes.position);
  const L=s.radius*0.45,o=bb.min.clone();
  axesGroup=new THREE.Group();
  axesGroup.add(arrow([1,0,0],L,0xd62728,'X',o),arrow([0,1,0],L,0x1f9d3a,'Y',o),arrow([0,0,1],L,0x1f5fd6,'Z',o));
  scene.add(axesGroup);
  lineGroup=new THREE.Group();
  for(const L of (a.lines||[])){
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(L.pts),3));
    lineGroup.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:L.hex,depthTest:!L.label})));
    if(L.label){const n=L.pts.length; const sp=label(L.label,'#'+L.hex.toString(16).padStart(6,'0')); sp.position.set(L.pts[n-3],L.pts[n-2],L.pts[n-1]); const k=s.radius*0.16; sp.scale.set(k,k*0.4,1); lineGroup.add(sp);}
  }
  scene.add(lineGroup);
  if(a.pull){pullArrow=arrow(a.pull,s.radius*0.8,0xc000c0,'',s.center.clone().addScaledVector(new THREE.Vector3(...a.pull),-s.radius*1.0));scene.add(pullArrow);}
}
function build(a){
  const key=a.mesh_key, rev=JSON.stringify(a.geom_rev||[]); const pos=new Float32Array(a.pos);
  if(fitted!==key||geomRev!==rev||!geo||geo.attributes.position.array.length!==pos.length){
    const refit=fitted!==key; geomRev=rev;
    if(mesh){scene.remove(mesh);geo.dispose();}
    geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(pos.length),3)); geo.computeVertexNormals();
    mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,side:THREE.DoubleSide,flatShading:true,roughness:0.9,metalness:0}));
    scene.add(mesh); geo.computeBoundingSphere(); const s=geo.boundingSphere;
    if(refit){
    controls.target.copy(s.center);
    camera.up.set(0,0,1);
    if(a.view_dir){const vd=new THREE.Vector3(...a.view_dir).normalize();
      camera.position.copy(s.center).add(vd.multiplyScalar(s.radius*3.2));}
    else{camera.position.copy(s.center).add(new THREE.Vector3(1.1,-1.4,0.9).multiplyScalar(s.radius*2.4));}
    camera.near=s.radius/100; camera.far=s.radius*50; camera.updateProjectionMatrix(); fitted=key;
    }
  }
  const col=geo.attributes.color.array, c=new THREE.Color();
  for(let t=0;t<a.tri_color.length;t++){c.setHex(PALETTE[a.tri_color[t]]);for(let v=0;v<3;v++){const o=(t*3+v)*3;col[o]=c.r;col[o+1]=c.g;col[o+2]=c.b;}}
  geo.attributes.color.needsUpdate=true; overlays(a);
  const tf=a.tri_face||[]; faceTris={}; for(let t=0;t<tf.length;t++){const f=tf[t]; if(f<0)continue; (faceTris[f]||(faceTris[f]=[])).push(t);}
  // toggles the server has applied (ack = time of the last click it took over) are in a.selected
  inflight=inflight.filter(x=>x.t>(a.ack||0)); serverSel=new Set(a.selected||[]);
  for(const x of inflight)for(const f of x.set)paintFace(f,isSel(f)?1:0);
  for(const f of pendingT)paintFace(f,isSel(f)?1:0);
  faceInfo={}; for(const [i,ar] of a.faces)faceInfo[i]=ar;
}
window.addEventListener('message',ev=>{
  if(ev.data.type!=='streamlit:render')return; args=ev.data.args; if(!renderer)init();
  document.getElementById('hint').textContent=args.readonly?'Sürükle: her yöne 360° döndür · tekerlek: yakınlaştır':document.getElementById('hint').textContent;
  resize(args.height||520); build(args);
});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
