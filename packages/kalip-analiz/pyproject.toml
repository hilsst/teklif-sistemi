[project]
name = "kalip-analiz"
version = "0.1.0"
description = "Automatic pull direction, split-mold and core (maça) marking for a mold surface, with a three.js viewer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pydantic>=2.7", "pyyaml>=6.0"]

[project.optional-dependencies]
cad = ["cadquery-ocp>=7.7"]
streamlit = ["streamlit>=1.38"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalip_analiz"]
