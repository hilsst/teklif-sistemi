# kalip-analiz varsayılan eşikleri. Hiçbir eşik kodda değildir; hepsi buradan okunur.
# Kendi dosyanızı load_settings("benim_esiklerim.yaml") veya analyze(..., thresholds=...) ile
# verin: yalnız değiştirmek istediğiniz anahtarları yazmanız yeter, eksikler buradan gelir.
# Biçim teklif-sistemi'nin library/thresholds.yaml dosyasıyla aynıdır (o dosya doğrudan verilebilir).
# source: user = proje sahibinin verdiği eşik; default = algoritma varsayılanı (kalibre edilebilir).
draft:
  min_ok_deg: {value: 2.0, unit: deg, source: user, desc: "Bu açı ve üstü: tek parça kalıp"}
  warn_min_deg: {value: 0.0, unit: deg, source: user, desc: "0 ile min_ok arası: uyarı; altı: ters açı"}
  warn_review_ratio: {value: 0.25, unit: ratio, source: default, desc: "0-2° (uyarı) bölgesi kalıp yüzeyinin bu payını aşarsa çekme yönü manual_review"}
undercut:
  core_max_area_ratio: {value: 0.10, unit: ratio, source: user, desc: "Ters açı bölgesi alanı / kalıp alanı bu orandan küçükse maça"}
  noise_area_ratio: {value: 0.002, unit: ratio, source: default, desc: "Bu orandan küçük VE noise_draft_deg'den sığ ters açı lekesi tessellation gürültüsü sayılır"}
  noise_draft_deg: {value: 10.0, unit: deg, source: default, desc: "Gürültü sayılabilecek en derin ters açı (0 ile -bu değer arası)"}
  opposite_cos: {value: -0.5, unit: ratio, source: default, desc: "İki ters açı bölgesinin yanal normalleri arasındaki kosinüs bunun altındaysa karşılıklı iki yan sayılır"}
  max_split_pieces: {value: 3, unit: count, source: user, desc: "Bölünmüş kalıpta önerilecek en fazla parça sayısı"}
  core_cost_weight: {value: 1.0, unit: ratio, source: default, desc: "Yöntem karşılaştırması: bir maçanın göreli puanı (kalibre edilmeli)"}
  core_area_cost_weight: {value: 100.0, unit: ratio, source: default, desc: "Yöntem karşılaştırması: maçaların kalıp yüzeyindeki toplam alan payı başına puan"}
  split_cost_weight: {value: 3.0, unit: ratio, source: default, desc: "Yöntem karşılaştırması: kalıbın her ek parçasının göreli puanı (kalibre edilmeli)"}
  unresolved_cost_weight: {value: 100.0, unit: ratio, source: default, desc: "Yöntem karşılaştırması: çözülemeyen her ters açı bölgesi için ceza puanı"}
  warn_cost_weight: {value: 2.0, unit: ratio, source: default, desc: "Yöntem karşılaştırması: yüzeyin tamamı düşük çekme (warn_min–min_ok) çıkarsa eklenen puan"}
  sandwich_tol_deg: {value: 10.0, unit: deg, source: default, desc: "İki ayırma düzlemi arasındaki parçanın düzleme paralel çıkışındaki izin verilen sapma"}
  threshold_margin_ratio: {value: 0.2, unit: ratio, source: default, desc: "Bölge alan oranı maça eşiğine bu bağıl pay kadar yakınsa karar manual_review"}
pull_search:
  max_tilt_deg: {value: 90.0, unit: deg, source: default, desc: "Aday çekme yönleri seçili yüzeyin ortalama iç normalinden en fazla bu kadar sapar"}
  samples: {value: 600, unit: count, source: default, desc: "Küre üzerinde taranan aday yön sayısı"}
  piece_max_tilt_deg: {value: 120.0, unit: deg, source: default, desc: "Bölünmüş kalıp parçalarının çekme yönü, parçanın ortalama iç normalinden en fazla bu kadar sapar"}
  refine_min_step_deg: {value: 0.1, unit: deg, source: default, desc: "Yerel optimizasyonun en küçük adımı"}
  robust_min_quantile: {value: 0.01, unit: ratio, source: default, desc: "En küçük çekme açısı üçgenlerin bu payı dışarıda bırakılarak okunur"}
mesh:
  # STEP tessellation. Analiz ağı inceliği karar doğruluğunu, görünüm ağı yalnız ekranı etkiler.
  linear_deflection_mm: {value: 2.0, unit: mm, source: default, desc: "Analiz ağı doğrusal sapması"}
  angular_deflection_deg: {value: 3.0, unit: deg, source: default, desc: "Analiz ağı açısal sapması (3°: 2-5 m² panel ~5 sn; üçgen normalleri gerçek yüzey normalinden alınır)"}
  view_deflection_mm: {value: 5.0, unit: mm, source: default, desc: "3B görünüm ağı doğrusal sapması (yalnız ekran)"}
  view_angle_deg: {value: 10.0, unit: deg, source: default, desc: "3B görünüm ağı açısal sapması (yalnız ekran)"}
viewer:
  select_pause_s: {value: 2.0, unit: s, source: user, desc: "Yüz seçerken bu kadar ara verince tek güncelleme yapılır"}
  parting_wall_ratio: {value: 0.06, unit: ratio, source: default, desc: "Ayırma yüzeyi şeridinin derinliği / kalıp yüzeyi zarf köşegeni"}
  core_marker_ratio: {value: 0.012, unit: ratio, source: default, desc: "Maça artı işaretinin yarı boyu / zarf köşegeni"}
  core_leader_ratio: {value: 0.10, unit: ratio, source: default, desc: "Maça etiket çizgisinin boyu / zarf köşegeni"}
  piece_arrow_ratio: {value: 0.30, unit: ratio, source: default, desc: "Kalıp parçası çekme okunun boyu / zarf köşegeni"}
